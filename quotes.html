<!DOCTYPE html>

  <title>Quotes Penyemangat — SahabatRay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Sahabat<span class="in">Ray</span></a>
      <button class="nav-toggle" aria-label="Menu">
        <i class="fa fa-bars"></i>
      </button>
      <div class="nav-links">
        <a href="index.html"><i class="fa fa-home"></i><span class="nav-text">Beranda</span></a>
        <a href="konselor.html"><i class="fa fa-user-friends"></i><span class="nav-text">Konselor</span></a>
        <a href="artikel.html"><i class="fa fa-newspaper"></i><span class="nav-text">Artikel</span></a>

      </div>
    </div>
  </nav>

  <section class="quotes-section">
    <div class="quotes-container">
      <div class="section-header reveal">
        <div class="section-tag">Quotes</div>
        <h2 class="section-title">Quotes <span class="highlight">Penyemangat</span></h2>
        <p class="section-desc">Dapatkan kutipan motivasi secara acak setiap hari.</p>

      <div class="quotes-card reveal">

        <p class="quotes-text" id="quote-text" style="transition:all 0.4s var(--ease-out);">Loading...</p>
        <button class="btn btn-outline quotes-btn" id="new-quote-btn">
          <span class="quotes-btn-icon">🔄</span>
          <span>Tampilkan Kutipan Baru</span>
        </button>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>© 2025 SahabatRay — Semua hak dilindungi. Dibuat dengan <span style="color:var(--accent);">❤</span> untuk kesehatan mental remaja.</p>
